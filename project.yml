# Xcode project for the iPhone application, generated by XcodeGen.
#
# The macOS application is still built by Swift Package Manager: it does not
# need Xcode. Only the iOS application does, because SPM cannot produce a
# signable iOS bundle.
#
# Regenerate with:  xcodegen generate
name: AnoleiOS
options:
  bundleIdPrefix: fr.laatortuejaune
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # The core is a real module, exactly as on the macOS side: the application
  # imports it instead of absorbing its files. The sources are shared as they
  # are, the files that drive subprocesses being already conditioned on macOS.
  AnoleCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AnoleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.laatortuejaune.anolecore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  # Map and location services, shared with the macOS application.
  AnoleServices:
    type: framework
    platform: iOS
    sources:
      - path: Sources/AnoleServices
    dependencies:
      - target: AnoleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.laatortuejaune.anoleservices
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  AnoleiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/AnoleiOS
    dependencies:
      - target: AnoleCore
      - target: AnoleServices
      - framework: Vendor/IDevice.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.laatortuejaune.anole
        # The Info.plist is generated from the INFOPLIST_KEY_* keys below,
        # rather than maintained by hand.
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Anole
        # Allows dropping the pairing file into the application from the
        # Finder, without having to implement the whole pairing flow.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        # Without these descriptions, iOS silently denies the request.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Anole shows your real location on the map to compare it with the simulated location.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          Anole talks to this device's services to apply the simulated location.
